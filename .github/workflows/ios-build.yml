name: Build iOS application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build unsigned iPhone app
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_COMMIT: ${{ github.sha }}
      CI: '1'
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install iOS dependencies
        working-directory: ios
        run: pod install
      - name: Build unsigned iOS application
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          project=$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$workspace" && test -n "$project"
          scheme=$(basename "$project" .xcodeproj)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          app=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/product-brief-ios-unsigned.ipa" Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: product-brief-ios-unsigned
          path: product-brief-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
